<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Federal & State Tax Impact Analyzer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (v18) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-full text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white bg-slate-900">
  
  <!-- APP MOUNT CONTAINER -->
  <div id="root" class="min-h-full flex flex-col"></div>

  <!-- REACT APP CODE -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    const TAX_CHANGES = [
      {
        id: 'rates',
        category: 'income',
        title: 'Tax Rates & Brackets Extension',
        previous: 'Reversion to pre-2018 brackets (up to 39.6%)',
        newLaw: 'Permanent brackets: 10%, 12%, 22%, 24%, 32%, 35%, 37%',
        impact: 'Prevents automatic income tax hikes across all income tiers.',
        badge: 'High Impact'
      },
      {
        id: 'salt',
        category: 'deductions',
        title: 'State & Local Tax (SALT) Cap Increase',
        previous: 'Capped strictly at \$10,000 for itemizers',
        newLaw: 'Raised to \$40,400 (Phases out above \$252.5k Single / \$505k MFJ)',
        impact: 'Substantial tax relief for homeowners in high-tax states.',
        badge: 'Major Relief'
      },
      {
        id: 'overtime_tips',
        category: 'income',
        title: 'Overtime & Tip Pay Exemptions',
        previous: 'Fully taxable as regular ordinary wage income',
        newLaw: 'Up to \$25k tip deduction & up to \$12.5k overtime deduction',
        impact: 'Deductions apply above-the-line regardless of standard/itemized choice.',
        badge: 'New Incentive'
      },
      {
        id: 'seniors',
        category: 'seniors',
        title: 'Senior Citizen Bonus Deduction (65+)',
        previous: 'Standard age-based addition (\$1,550–\$1,950)',
        newLaw: 'Additional \$6,000 bonus deduction per qualifying senior taxpayer',
        impact: 'Provides targeted relief for fixed-income retirees.',
        badge: 'Retirement Care'
      },
      {
        id: 'qbi',
        category: 'business',
        title: 'Section 199A QBI Deduction Permanency',
        previous: 'Scheduled to expire completely after 2025',
        newLaw: 'Permanent 20% write-off on eligible pass-through business profit',
        impact: 'Protects main-street small businesses, LLCs, S-Corps, and freelancers.',
        badge: 'Small Biz'
      },
      {
        id: 'car_loan',
        category: 'deductions',
        title: 'US-Assembled Vehicle Loan Interest',
        previous: 'Non-deductible personal interest',
        newLaw: 'Deductible up to \$10,000 for eligible qualified US vehicle loans',
        impact: 'Phased out above \$100k Single / \$200k MFJ income.',
        badge: 'New Credit'
      }
    ];

    const STATE_RULES = {
      CA: { name: 'California', type: 'Selective Conformity', saltImpact: 'Huge SALT cap boost (\$40.4k)', ptet: 'Active (AB 150 PTET)', tipConformity: 'No state deduction for tips/overtime' },
      NY: { name: 'New York', type: 'Selective Conformity', saltImpact: 'Huge SALT cap boost (\$40.4k)', ptet: 'Active (NY PTET)', tipConformity: 'No state deduction for tips/overtime' },
      GA: { name: 'Georgia', type: 'Rolling Conformity', saltImpact: 'Moderate', ptet: 'Active', tipConformity: 'Adopts federal exclusions automatically' },
      TX: { name: 'Texas', type: 'No Income Tax', saltImpact: 'N/A (Property tax SALT relief only)', ptet: 'N/A', tipConformity: 'No state income tax' },
      FL: { name: 'Florida', type: 'No Income Tax', saltImpact: 'N/A (Property tax SALT relief only)', ptet: 'N/A', tipConformity: 'No state income tax' },
      VA: { name: 'Virginia', type: 'Static Conformity', saltImpact: 'Moderate', ptet: 'Active', tipConformity: 'Conforms to federal AGI definitions' }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [filterCategory, setFilterCategory] = useState('all');
      
      // Calculator state
      const [income, setIncome] = useState(110000);
      const [status, setStatus] = useState('mfj');
      const [tipsOvertime, setTipsOvertime] = useState(8000);
      const [saltPaid, setSaltPaid] = useState(16000);
      const [isSenior, setIsSenior] = useState(false);
      const [selectedState, setSelectedState] = useState('CA');

      // AI QA State
      const [question, setQuestion] = useState('');
      const [chatLog, setChatLog] = useState([
        { role: 'assistant', text: 'Hello! Ask me any questions about federal & state tax laws, SALT cap increases, overtime exemptions, or business QBI rules.' }
      ]);

      // Calculator engine
      const calcResults = useMemo(() => {
        const stdDeduction = status === 'mfj' ? 32200 : 16100;
        const seniorBonus = isSenior ? (status === 'mfj' ? 12000 : 6000) : 0;
        const totalTipsExempt = Math.min(25000, tipsOvertime);
        const saltAllowedNew = Math.min(40400, saltPaid);
        const saltAllowedOld = Math.min(10000, saltPaid);

        const effectiveDeductionNew = Math.max(stdDeduction, saltAllowedNew) + seniorBonus + totalTipsExempt;
        const oldStd = status === 'mfj' ? 14000 : 7000;
        const effectiveDeductionOld = Math.max(oldStd, saltAllowedOld);

        const taxableNew = Math.max(0, income - effectiveDeductionNew);
        const taxableOld = Math.max(0, income - effectiveDeductionOld);

        const taxNew = Math.round(taxableNew * 0.17);
        const taxOld = Math.round(taxableOld * 0.22);
        const savings = Math.max(0, taxOld - taxNew);

        return { stdDeduction, seniorBonus, totalTipsExempt, taxNew, taxOld, savings, effectiveDeductionNew, effectiveDeductionOld };
      }, [income, status, tipsOvertime, saltPaid, isSenior]);

      const handleAskQuestion = (e) => {
        e.preventDefault();
        if (!question.trim()) return;

        const userQ = question;
        setChatLog(prev => [...prev, { role: 'user', text: userQ }]);
        setQuestion('');

        setTimeout(() => {
          let reply = "Under updated tax provisions, this scenario benefits from expanded deductions and adjusted bracket thresholds.";
          const qLower = userQ.toLowerCase();

          if (qLower.includes('salt')) {
            reply = "The State and Local Tax (SALT) cap is expanded to \$40,400 (up from \$10,000). It begins phasing out for single filers earning over \$252,500 (\$505,000 for joint filers).";
          } else if (qLower.includes('overtime') || qLower.includes('tip')) {
            reply = "Qualifying tips are eligible for an above-the-line deduction up to \$25,000, and qualified overtime pay is deductible up to \$12,500.";
          } else if (qLower.includes('senior') || qLower.includes('65')) {
            reply = "Taxpayers aged 65 or older receive an extra \$6,000 bonus deduction per qualifying individual.";
          } else if (qLower.includes('business') || qLower.includes('qbi')) {
            reply = "The Section 199A Qualified Business Income (QBI) deduction allows eligible pass-through owners (S-Corps, LLCs, Sole Props) to deduct up to 20% of qualified business income.";
          }

          setChatLog(prev => [...prev, { role: 'assistant', text: reply }]);
        }, 500);
      };

      const filteredChanges = TAX_CHANGES.filter(c => filterCategory === 'all' || c.category === filterCategory);

      return (
        <div className="flex-1 flex flex-col bg-slate-900 text-slate-100 min-h-screen">
          {/* HEADER */}
          <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg border border-indigo-500/30">
                  <span className="font-bold text-lg">📊</span>
                </div>
                <div>
                  <h1 className="font-bold text-lg text-white leading-tight">Tax Client Impact Hub</h1>
                  <p className="text-xs text-slate-400">Federal & State Tax Law Comparison System</p>
                </div>
              </div>

              {/* TABS */}
              <nav className="flex space-x-2">
                {[
                  { id: 'overview', label: 'Top Changes' },
                  { id: 'calculator', label: 'Impact Estimator' },
                  { id: 'states', label: 'State Rules' },
                  { id: 'assistant', label: 'Ask Assistant' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition ${
                      activeTab === tab.id
                        ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            
            {/* OVERVIEW TAB */}
            {activeTab === 'overview' && (
              <div className="space-y-6">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800/40 p-6 rounded-2xl border border-slate-700/50">
                  <div>
                    <h2 className="text-xl font-bold text-white">Federal Tax Reform Breakdown</h2>
                    <p className="text-sm text-slate-400 mt-1">Comparing Law Provisions vs. Previous Reversion Baselines</p>
                  </div>
                  
                  <div className="flex flex-wrap gap-2">
                    {[
                      { id: 'all', label: 'All Items' },
                      { id: 'income', label: 'Rates & Income' },
                      { id: 'deductions', label: 'Deductions & SALT' },
                      { id: 'business', label: 'Small Business' },
                      { id: 'seniors', label: 'Seniors' }
                    ].map(cat => (
                      <button
                        key={cat.id}
                        onClick={() => setFilterCategory(cat.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                          filterCategory === cat.id
                            ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/40'
                            : 'bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700/50'
                        }`}
                      >
                        {cat.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredChanges.map(item => (
                    <div key={item.id} className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-600 transition">
                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <span className="px-2.5 py-1 text-xs font-semibold text-indigo-400 bg-indigo-950/60 border border-indigo-800/50 rounded-full">
                            {item.badge}
                          </span>
                          <span className="text-xs text-slate-500 uppercase tracking-wider font-mono">{item.category}</span>
                        </div>
                        <h3 className="font-bold text-slate-100 text-base mb-4">{item.title}</h3>
                        
                        <div className="space-y-3 text-xs mb-4">
                          <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                            <span className="text-slate-500 block mb-1 font-medium">Prior Baseline:</span>
                            <span className="text-slate-400">{item.previous}</span>
                          </div>
                          <div className="p-3 bg-emerald-950/30 rounded-xl border border-emerald-800/30">
                            <span className="text-emerald-400 block mb-1 font-medium">Updated Tax Law:</span>
                            <span className="text-emerald-200 font-medium">{item.newLaw}</span>
                          </div>
                        </div>
                      </div>
                      
                      <div className="pt-3 border-t border-slate-700/50 text-xs text-slate-400">
                        <span>{item.impact}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CALCULATOR TAB */}
            {activeTab === 'calculator' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-5 bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 space-y-6">
                  <h2 className="text-lg font-bold text-white">Client Profile Inputs</h2>

                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Annual Income</label>
                      <input
                        type="range"
                        min="30000"
                        max="400000"
                        step="5000"
                        value={income}
                        onChange={(e) => setIncome(Number(e.target.value))}
                        className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                      />
                      <div className="text-right text-indigo-400 font-mono font-bold text-lg mt-1">\${income.toLocaleString()}</div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Filing Status</label>
                      <div className="grid grid-cols-2 gap-2">
                        {[
                          { id: 'single', label: 'Single' },
                          { id: 'mfj', label: 'Married Joint' }
                        ].map(st => (
                          <button
                            key={st.id}
                            onClick={() => setStatus(st.id)}
                            className={`py-2 px-3 rounded-lg text-xs font-medium border transition ${
                              status === st.id
                                ? 'bg-indigo-600 border-indigo-500 text-white'
                                : 'bg-slate-900/60 border-slate-700 text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            {st.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Tips & Overtime Pay</label>
                      <input
                        type="range"
                        min="0"
                        max="40000"
                        step="1000"
                        value={tipsOvertime}
                        onChange={(e) => setTipsOvertime(Number(e.target.value))}
                        className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                      />
                      <div className="text-right text-indigo-400 font-mono font-bold text-sm mt-1">\${tipsOvertime.toLocaleString()}</div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">State & Local Taxes Paid (SALT)</label>
                      <input
                        type="range"
                        min="0"
                        max="50000"
                        step="1000"
                        value={saltPaid}
                        onChange={(e) => setSaltPaid(Number(e.target.value))}
                        className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                      />
                      <div className="text-right text-indigo-400 font-mono font-bold text-sm mt-1">\${saltPaid.toLocaleString()}</div>
                    </div>

                    <div className="pt-2 border-t border-slate-700/50 flex items-center justify-between">
                      <span className="text-xs font-semibold text-slate-300 uppercase">Senior Status (Age 65+)</span>
                      <button
                        onClick={() => setIsSenior(!isSenior)}
                        className={`w-12 h-6 flex items-center rounded-full p-1 transition ${isSenior ? 'bg-indigo-600' : 'bg-slate-700'}`}
                      >
                        <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition ${isSenior ? 'translate-x-6' : ''}`}></div>
                      </button>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-7 space-y-6">
                  <div className="bg-gradient-to-br from-indigo-950/40 via-slate-800/60 to-slate-900 border border-indigo-500/30 rounded-2xl p-6">
                    <h3 className="text-xs uppercase font-semibold text-indigo-400 tracking-wider mb-1">Estimated Annual Tax Savings</h3>
                    <div className="text-4xl font-extrabold text-emerald-400 font-mono">\${calcResults.savings.toLocaleString()}</div>
                    <p className="text-xs text-slate-400 mt-2">Projected tax savings compared to prior baseline rules.</p>

                    <div className="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-700/50">
                      <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                        <span className="text-xs text-slate-400 block mb-1">Updated Tax Liability</span>
                        <span className="text-xl font-bold text-slate-100 font-mono">\${calcResults.taxNew.toLocaleString()}</span>
                      </div>
                      <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                        <span className="text-xs text-slate-400 block mb-1">Prior Baseline Tax</span>
                        <span className="text-xl font-bold text-slate-400 line-through font-mono">\${calcResults.taxOld.toLocaleString()}</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6">
                    <h3 className="text-sm font-bold text-slate-200 mb-4">Deduction Stack Comparison</h3>
                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-emerald-400 font-medium">Updated Deductions</span>
                          <span className="font-mono text-emerald-400">\${calcResults.effectiveDeductionNew.toLocaleString()}</span>
                        </div>
                        <div className="w-full bg-slate-900 h-3 rounded-full overflow-hidden">
                          <div className="bg-emerald-500 h-full rounded-full transition-all" style={{ width: `${Math.min(100, (calcResults.effectiveDeductionNew / 60000) * 100)}%` }}></div>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-slate-400 font-medium">Prior Baseline Deductions</span>
                          <span className="font-mono text-slate-400">\${calcResults.effectiveDeductionOld.toLocaleString()}</span>
                        </div>
                        <div className="w-full bg-slate-900 h-3 rounded-full overflow-hidden">
                          <div className="bg-slate-600 h-full rounded-full transition-all" style={{ width: `${Math.min(100, (calcResults.effectiveDeductionOld / 60000) * 100)}%` }}></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* STATE RULES TAB */}
            {activeTab === 'states' && (
              <div className="space-y-6">
                <div className="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6">
                  <h2 className="text-lg font-bold text-white mb-4">State Conformity & SALT Guide</h2>
                  <div className="flex flex-wrap gap-2 mb-6">
                    {Object.keys(STATE_RULES).map(st => (
                      <button
                        key={st}
                        onClick={() => setSelectedState(st)}
                        className={`px-4 py-2 rounded-xl font-bold text-sm transition ${
                          selectedState === st
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-900/60 text-slate-400 hover:bg-slate-800'
                        }`}
                      >
                        {st} - {STATE_RULES[st].name}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/60 p-6 rounded-xl border border-slate-800">
                    <div>
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Conformity Type</span>
                      <span className="text-lg font-bold text-indigo-400">{STATE_RULES[selectedState].type}</span>
                    </div>
                    <div>
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Pass-Through Entity Tax (PTET)</span>
                      <span className="text-lg font-bold text-emerald-400">{STATE_RULES[selectedState].ptet}</span>
                    </div>
                    <div>
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">SALT Relief Benefit</span>
                      <span className="text-slate-200">{STATE_RULES[selectedState].saltImpact}</span>
                    </div>
                    <div>
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Tips & Overtime State Exclusion</span>
                      <span className="text-slate-200">{STATE_RULES[selectedState].tipConformity}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Q&A ASSISTANT TAB */}
            {activeTab === 'assistant' && (
              <div className="bg-slate-800/50 border border-slate-700/60 rounded-2xl flex flex-col h-[550px]">
                <div className="p-4 border-b border-slate-700/60">
                  <h3 className="font-bold text-slate-100 text-sm">Tax Knowledge Assistant</h3>
                  <p className="text-xs text-slate-400">Ask questions regarding tax law impacts</p>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-4">
                  {chatLog.map((msg, index) => (
                    <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[80%] rounded-2xl p-4 text-sm ${
                        msg.role === 'user'
                          ? 'bg-indigo-600 text-white rounded-br-none'
                          : 'bg-slate-900 border border-slate-700/80 text-slate-200 rounded-bl-none'
                      }`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleAskQuestion} className="p-4 border-t border-slate-700/60 flex gap-2">
                  <input
                    type="text"
                    value={question}
                    onChange={(e) => setQuestion(e.target.value)}
                    placeholder="Ask a question (e.g., How does the new SALT cap affect filers?)"
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                  />
                  <button
                    type="submit"
                    className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition"
                  >
                    Send
                  </button>
                </form>
              </div>
            )}

          </main>
        </div>
      );
    }

    // MOUNT TO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
